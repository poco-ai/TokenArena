name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4

  publish-cli:
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release versions
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # If release-please didn't produce a version, read the latest tag.
          if [ -z "${RELEASE_VERSION:-}" ]; then
            tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$tag" ]; then
              echo "::notice::No release tag; skipping version check"
              exit 0
            fi
            RELEASE_VERSION="${tag#v}"
            export RELEASE_VERSION
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.RELEASE_VERSION;
          if (!version) {
            console.log("::notice::No release version; skipping version check");
            process.exit(0);
          }
          const packages = [
            "package.json",
            "cli/package.json",
            "web/package.json",
          ];
          for (const file of packages) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            if (pkg.version !== version) {
              throw new Error(`${file} version ${pkg.version} does not match ${version}`);
            }
          }
          NODE

      - name: Test CLI
        run: pnpm --filter ./cli test

      - name: Build CLI
        run: pnpm --filter ./cli build

      - name: Smoke test packed CLI
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="${RUNNER_TEMP}/tokenarena-pack"
          smoke_dir="${RUNNER_TEMP}/tokenarena-smoke"
          mkdir -p "$pack_dir" "$smoke_dir"

          pnpm --filter ./cli pack --pack-destination "$pack_dir"
          package_file="$(find "$pack_dir" -name '*.tgz' -print -quit)"
          test -n "$package_file"

          cd "$smoke_dir"
          export npm_config_cache="$smoke_dir/.npm-cache"
          npm init -y
          npm install --no-audit --no-fund "$package_file"
          ./node_modules/.bin/tokenarena --help
          ./node_modules/.bin/tokenarena status

      - name: Pack release tarball
        id: pack-release
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -eux
          pack_dir="${RUNNER_TEMP}/tokenarena-release"
          mkdir -p "$pack_dir"
          pnpm --filter ./cli pack --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -name '*.tgz' -print -quit)"
          test -n "$tarball"
          tag="${RELEASE_TAG:-}"
          version="${RELEASE_VERSION:-}"
          if [ -z "$version" ]; then
            version=$(node -e "console.log(require('./cli/package.json').version)")
          fi
          if [ -z "$tag" ]; then
            tag="v${version}"
          fi
          asset_name="tokenarena-cli-v${version}.tgz"
          cp "$tarball" "$pack_dir/$asset_name"
          echo "tarball=$pack_dir/$asset_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish CLI to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if npm view "@ihadu/tokenarena@${RELEASE_VERSION}" version 2>/dev/null; then
            echo "::notice::${RELEASE_VERSION} already published, skipping npm publish"
          else
            pnpm --filter ./cli publish --no-git-checks
          fi

      - name: Upload tarball to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pack-release.outputs.tag }}
          TAR: ${{ steps.pack-release.outputs.tarball }}
        run: |
          set -eux
          gh release upload "$TAG" "$TAR" --clobber --repo "${{ github.repository }}"

  publish-web:
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_VERSION" ]; then
            fallback=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$fallback" ]; then
              echo "Using fallback tag from git: $fallback"
              RELEASE_VERSION="${fallback#v}"
              RELEASE_TAG="$fallback"
              export RELEASE_TAG RELEASE_VERSION
            else
              version=$(node -e "console.log(require('./cli/package.json').version)")
              RELEASE_TAG="v${version}"
              RELEASE_VERSION="$version"
              export RELEASE_TAG RELEASE_VERSION
            fi
          fi
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -eux
          tag="${RELEASE_TAG:-}"
          if [ -z "$tag" ]; then
            fallback=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$fallback" ]; then
              version=$(node -e "console.log(require('./cli/package.json').version)")
              fallback="v${version}"
            fi
            tag="$fallback"
          fi
          echo "tags=${tag}" >> "$GITHUB_OUTPUT"
          echo "labels=org.opencontainers.image.version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "build_arg_version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Web Docker image
        id: build-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.build_arg_version }}
          cache-from: type=gha,scope=tokenarena-web
          cache-to: type=gha,mode=max,scope=tokenarena-web

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-web.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
